<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid #000;
        }
        th {
            border: 1px solid #000;
        }

        td {
            border: 1px solid #000;
            padding: 5px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Image</th>
            <th>Rating</th>
        </tr>
        <tr th:each="recipes : ${listRecipes}">
            <td th:text="${recipes.id}"></td>
            <td th:text="${recipes.title}"></td>
            <td>
                <img th:src="${recipes.image}" style="width: 10%;">
            </td>
            <td th:text="${recipes.rating}"></td>
        </tr>
    </table>
</body>
</html>
