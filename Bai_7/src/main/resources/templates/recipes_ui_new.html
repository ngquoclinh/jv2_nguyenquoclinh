<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
      <h1>Item Gallery</h1>
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
        <div class="col" th:each="recipes : ${listRecipes}">
          <div class="card shadow-sm" >
            <img th:src="${recipes.image}" class="bd-placeholder-img card-img-top" height="225" width="100%">
            <div class="card-body">
              <h4 class="card-text" th:text="${recipes.title}"></h4>
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <p th:text="${recipes.rating}"></p>
                  <p th:text="${recipes.id}"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
